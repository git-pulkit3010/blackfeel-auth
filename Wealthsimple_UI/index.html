<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BlackWeave</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="split-screen">
        <section class="visual-side">
            <div class="visual-overlay"></div>
            <div class="brand-identity">
                <div class="logo-container">
                    <svg class="swan-icon" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 50 C 20 20, 50 10, 50 30 C 50 50, 80 50, 80 30" stroke="white" fill="none" stroke-width="3"/>
                        <line x1="10" y1="55" x2="90" y2="55" stroke="white" stroke-width="2" />
                    </svg>
                    <span class="brand-name">BlackWeave</span>
                </div>
            </div>
            <div class="marketing-copy">
                <h1>Half code, Half culture.<br>Designed with AI. Felt in real life.</h1>
            </div>
        </section>

        <section class="form-side">
            <div class="form-wrapper">
                <header class="form-header">
                    <h2>Welcome Back!</h2>
                </header>
                <form id="loginForm">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="input-field" placeholder="name@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                    </div>
                    <div class="form-utils">
                        <a href="#" class="text-link">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn-primary">Log in</button>
                </form>
                <footer class="footer-link">
                    New to BlackWeave? <a href="signup.html">Sign up</a>
                </footer>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
